[project]
name = "sqr"
version = "0.1.0"
requires-python = ">=3.13"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff.lint]
# Windows/WSL bind-mounts present 0777 for all files; git's index (100644) is the
# source of truth. EXE002 misfires against mount modes; EXE001 stays armed and
# catches real shebang-without-x-bit accidents on CI's real Linux.
ignore = ["EXE002"]

[dependency-groups]
dev = ["pytest>=9", "ruff>=0.9"]
